<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart-Renting</title>

<style>
:root{
    --bitel-yellow:#FFF200;
    --bitel-cyan:#00B8EB;
    --bitel-teal:#008D97;
    --bitel-deep:#003E4F;
    --bg:#f5f7fa;
}

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:var(--bg);
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h1{
    margin-top:0;
    color:var(--bitel-deep);
}

textarea{
    width:100%;
    min-height:260px;
    resize:vertical;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-send{
    background:var(--bitel-cyan);
    color:white;
}

.btn-copy{
    background:#16a34a;
    color:white;
}

.btn-clear{
    background:#dc2626;
    color:white;
}

.status{
    margin-top:10px;
    font-weight:bold;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:var(--bitel-deep);
    color:white;
    padding:10px;
    border:1px solid #ddd;
    white-space:nowrap;
}

td{
    padding:8px;
    border:1px solid #ddd;
    white-space:nowrap;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h1>🏠 Smart-Renting</h1>

        <textarea id="txtInput" placeholder="Pegue aquí el mensaje de WhatsApp..."></textarea>

        <div class="buttons">
            <button class="btn-send" onclick="consultar()">Consultar reporte</button>
            <button class="btn-copy" onclick="copiarExcel()">📋 Copiar para Excel</button>
            <button class="btn-clear" onclick="limpiar()">🗑 Limpiar</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table id="tblResultado" class="hidden">
                <thead>
                    <tr>
                        <th>SITE</th>
                        <th>CANDIDATE</th>
                        <th>LAT</th>
                        <th>LONG</th>
                        <th>HEIGHT OF TREE</th>
                        <th>HEIGHT OF HOUSE</th>
                        <th>HEIGHT OF TOWER</th>
                        <th>LINK TO</th>
                        <th>LOGICAL LINK</th>
                        <th>Main Tx</th>
                    </tr>
                </thead>
                <tbody id="tbodyResultado"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
const WEBHOOK_URL = "https://n8n.38-250-161-19.nip.io/webhook/smart-renting";

let ultimoResultado = [];

const COLUMNAS = [
    "SITE",
    "CANDIDATE",
    "LAT",
    "LONG",
    "HEIGHT OF TREE",
    "HEIGHT OF HOUSE",
    "HEIGHT OF TOWER",
    "LINK TO",
    "LOGICAL LINK",
    "Main Tx"
];

async function consultar(){

    const texto = document.getElementById("txtInput").value.trim();

    if(!texto){
        alert("Ingrese información.");
        return;
    }

    document.getElementById("status").innerHTML = "Procesando...";

    try{

        const response = await fetch(WEBHOOK_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                mensaje:texto
            })
        });

        const rawText = await response.text();

        console.log("RESPUESTA RAW:", rawText);

        if(!rawText.trim()){
            throw new Error("El webhook respondió vacío.");
        }

        let responseData;

        try{
            responseData = JSON.parse(rawText);
        }catch(error){
            throw new Error("El webhook no devolvió un JSON válido.");
        }

        const registros = normalizarRespuesta(responseData);

        ultimoResultado = registros;

        mostrarTabla(registros);

        document.getElementById("status").innerHTML =
        `✅ ${registros.length} registro(s) encontrado(s).`;

    }catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
        "❌ Error: " + error.message;
    }
}

function normalizarRespuesta(data){

    data = convertirTextoJson(data);

    if(Array.isArray(data)){
        return extraerRegistrosArray(data);
    }

    if(data && typeof data === "object"){

        if(data["SITE"]){
            return [data];
        }

        const camposPosibles = [
            "json",
            "body",
            "data",
            "mensaje",
            "message",
            "text",
            "output",
            "result",
            "registros"
        ];

        for(const campo of camposPosibles){

            if(data[campo] !== undefined){

                const valor = convertirTextoJson(data[campo]);

                if(Array.isArray(valor)){
                    return extraerRegistrosArray(valor);
                }

                if(valor && typeof valor === "object"){
                    return normalizarRespuesta(valor);
                }
            }
        }
    }

    throw new Error("No se encontraron registros válidos.");
}

function extraerRegistrosArray(array){

    const registros = [];

    array.forEach(item => {

        item = convertirTextoJson(item);

        if(item && item["SITE"]){
            registros.push(item);
            return;
        }

        if(item && item.json){

            const json = convertirTextoJson(item.json);

            if(Array.isArray(json)){
                registros.push(...extraerRegistrosArray(json));
            }else if(json && json["SITE"]){
                registros.push(json);
            }

            return;
        }

        if(item && typeof item === "object"){

            const camposPosibles = [
                "body",
                "data",
                "mensaje",
                "message",
                "text",
                "output",
                "result",
                "registros"
            ];

            for(const campo of camposPosibles){

                if(item[campo] !== undefined){

                    const valor = convertirTextoJson(item[campo]);

                    if(Array.isArray(valor)){
                        registros.push(...extraerRegistrosArray(valor));
                    }else if(valor && valor["SITE"]){
                        registros.push(valor);
                    }

                    return;
                }
            }
        }
    });

    if(!registros.length){
        throw new Error("El array recibido no contiene registros con SITE.");
    }

    return registros;
}

function convertirTextoJson(valor){

    if(typeof valor !== "string"){
        return valor;
    }

    let texto = valor.trim();

    texto = texto
        .replace(/^```json/i, "")
        .replace(/^```/i, "")
        .replace(/```$/i, "")
        .trim();

    try{
        return JSON.parse(texto);
    }catch(error){
        return valor;
    }
}

function mostrarTabla(registros){

    const tbody = document.getElementById("tbodyResultado");

    tbody.innerHTML = "";

    registros.forEach(r => {

        const tr = document.createElement("tr");

        tr.innerHTML = COLUMNAS.map(col => {
            return `<td>${escaparHtml(r[col] ?? "")}</td>`;
        }).join("");

        tbody.appendChild(tr);
    });

    document.getElementById("tblResultado").classList.remove("hidden");
}

function escaparHtml(valor){

    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function copiarExcel(){

    if(!ultimoResultado.length){
        alert("No hay datos.");
        return;
    }

    const texto = ultimoResultado.map(r => {
        return COLUMNAS.map(col => r[col] ?? "").join("\t");
    }).join("\n");

    await navigator.clipboard.writeText(texto);

    alert("Datos copiados para Excel.");
}

function limpiar(){

    document.getElementById("txtInput").value = "";
    document.getElementById("tbodyResultado").innerHTML = "";
    document.getElementById("tblResultado").classList.add("hidden");
    document.getElementById("status").innerHTML = "";

    ultimoResultado = [];
}
</script>

</body>
</html>
