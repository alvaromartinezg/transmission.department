<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart-Renting</title>

<style>
:root{
    --bitel-yellow:#FFF200;
    --bitel-cyan:#00B8EB;
    --bitel-teal:#008D97;
    --bitel-deep:#003E4F;
    --bg:#f5f7fa;
}

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:var(--bg);
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h1{
    margin-top:0;
    color:var(--bitel-deep);
}

textarea{
    width:100%;
    min-height:260px;
    resize:vertical;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-send{
    background:var(--bitel-cyan);
    color:white;
}

.btn-copy{
    background:#16a34a;
    color:white;
}

.btn-clear{
    background:#dc2626;
    color:white;
}

.status{
    margin-top:10px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:var(--bitel-deep);
    color:white;
    padding:10px;
    border:1px solid #ddd;
}

td{
    padding:8px;
    border:1px solid #ddd;
}

.hidden{
    display:none;
}
</style>

</head>
<body>

<div class="container">

<div class="card">
    <h1>🏠 Smart-Renting</h1>

    <textarea id="txtInput" placeholder="Pegue aquí el mensaje de WhatsApp..."></textarea>

    <div class="buttons">
        <button class="btn-send" onclick="consultar()">Consultar reporte</button>
        <button class="btn-copy" onclick="copiarExcel()">📋 Copiar para Excel</button>
        <button class="btn-clear" onclick="limpiar()">🗑 Limpiar</button>
    </div>

    <div class="status" id="status"></div>
</div>

<div class="card">
    <table id="tblResultado" class="hidden">
        <thead>
            <tr>
                <th>SITE</th>
                <th>CANDIDATE</th>
                <th>LAT</th>
                <th>LONG</th>
                <th>HEIGHT OF TREE</th>
                <th>HEIGHT OF HOUSE</th>
                <th>HEIGHT OF TOWER</th>
                <th>LINK TO</th>
                <th>LOGICAL LINK</th>
                <th>Main Tx</th>
            </tr>
        </thead>
        <tbody id="tbodyResultado"></tbody>
    </table>
</div>

</div>

<script>
const WEBHOOK_URL =
"https://n8n.38-250-161-19.nip.io/webhook/smart-renting";

let ultimoResultado = [];

const COLUMNAS = [
    "SITE",
    "CANDIDATE",
    "LAT",
    "LONG",
    "HEIGHT OF TREE",
    "HEIGHT OF HOUSE",
    "HEIGHT OF TOWER",
    "LINK TO",
    "LOGICAL LINK",
    "Main Tx"
];

async function consultar(){

    const texto = document.getElementById("txtInput").value.trim();

    if(!texto){
        alert("Ingrese información.");
        return;
    }

    document.getElementById("status").innerHTML = "Procesando...";

    try{
        const response = await fetch(WEBHOOK_URL,{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ mensaje:texto })
        });

        const rawText = await response.text();

        console.log("RESPUESTA RAW N8N:", rawText);

        let responseData;

        try{
            responseData = JSON.parse(rawText);
        }catch(e){
            throw new Error("n8n no devolvió JSON válido.");
        }

        const registros = normalizarRespuesta(responseData);

        ultimoResultado = registros;

        mostrarTabla(registros);

        document.getElementById("status").innerHTML =
        `✅ ${registros.length} registro(s) encontrado(s).`;

    }catch(error){
        console.error(error);
        document.getElementById("status").innerHTML =
        "❌ Error: " + error.message;
    }
}

function normalizarRespuesta(data){

    data = limpiarSiEsTextoJson(data);

    // Caso: array directo
    if(Array.isArray(data)){
        return extraerRegistrosDeArray(data);
    }

    // Casos comunes de n8n
    const posiblesCampos = [
        "mensaje",
        "text",
        "data",
        "body",
        "json",
        "output",
        "result",
        "registros"
    ];

    for(const campo of posiblesCampos){
        if(data && data[campo] !== undefined){
            const valor = limpiarSiEsTextoJson(data[campo]);

            if(Array.isArray(valor)){
                return extraerRegistrosDeArray(valor);
            }

            if(valor && typeof valor === "object"){
                return normalizarRespuesta(valor);
            }
        }
    }

    // Caso: un solo objeto con SITE
    if(data && data["SITE"]){
        return [data];
    }

    throw new Error("La respuesta no tiene formato reconocido.");
}

function limpiarSiEsTextoJson(valor){

    if(typeof valor !== "string"){
        return valor;
    }

    let texto = valor.trim();

    // Quita bloques tipo ```json ... ```
    texto = texto
        .replace(/^```json/i, "")
        .replace(/^```/i, "")
        .replace(/```$/i, "")
        .trim();

    try{
        return JSON.parse(texto);
    }catch(e){
        return valor;
    }
}

function extraerRegistrosDeArray(arr){

    const registros = [];

    arr.forEach(item => {

        item = limpiarSiEsTextoJson(item);

        // Si el item ya es registro
        if(item && item["SITE"]){
            registros.push(item);
            return;
        }

        // Si n8n lo envuelve como { json: {...} }
        if(item && item.json){
            const json = limpiarSiEsTextoJson(item.json);

            if(Array.isArray(json)){
                registros.push(...extraerRegistrosDeArray(json));
            }else if(json && json["SITE"]){
                registros.push(json);
            }else{
                const sub = normalizarRespuesta(json);
                registros.push(...sub);
            }

            return;
        }

        // Si viene como { data: [...] }, { body: [...] }, etc.
        const campos = ["mensaje","text","data","body","output","result","registros"];

        for(const campo of campos){
            if(item && item[campo] !== undefined){
                const valor = limpiarSiEsTextoJson(item[campo]);

                if(Array.isArray(valor)){
                    registros.push(...extraerRegistrosDeArray(valor));
                }else if(valor && valor["SITE"]){
                    registros.push(valor);
                }

                return;
            }
        }
    });

    if(!registros.length){
        throw new Error("No se encontraron registros con SITE.");
    }

    return registros;
}

function mostrarTabla(registros){

    const tbody = document.getElementById("tbodyResultado");
    tbody.innerHTML = "";

    registros.forEach(r => {

        const tr = document.createElement("tr");

        tr.innerHTML = COLUMNAS.map(col =>
            `<td>${escaparHtml(r[col] ?? "")}</td>`
        ).join("");

        tbody.appendChild(tr);
    });

    document.getElementById("tblResultado").classList.remove("hidden");
}

function escaparHtml(valor){
    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function copiarExcel(){

    if(!ultimoResultado.length){
        alert("No hay datos.");
        return;
    }

    let texto = "";

    ultimoResultado.forEach(r => {
        texto += COLUMNAS.map(col => r[col] ?? "").join("\t") + "\n";
    });

    await navigator.clipboard.writeText(texto);

    alert("Datos copiados para Excel.");
}

function limpiar(){

    document.getElementById("txtInput").value = "";
    document.getElementById("tbodyResultado").innerHTML = "";
    document.getElementById("tblResultado").classList.add("hidden");
    document.getElementById("status").innerHTML = "";

    ultimoResultado = [];
}
</script>
    
</body>
</html>
